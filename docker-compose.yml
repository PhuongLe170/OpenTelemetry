services:
  clients.api:
    image: clients.api
    restart: always
    build:
      context: .
      dockerfile: src/Clients.Api/Dockerfile
    environment:
        ConnectionStrings__ClientsDb: Host=clients.db;Port=5432;Database=ClientsDb;Username=postgres;Password=postgres
        ConnectionStrings__ClientsCache: clients.cache:6379
        ConnectionStrings__RabbitMq: amqp://guest:guest@rabbitmq:5672/
        RiskEvaluator__Url: http://risk.evaluator.service:8080
        Feature__PublishEventFailure: false
        OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:  
      - "8080:8080"
    depends_on:
      - clients.db
      - rabbitmq
      - clients.cache
      - risk.evaluator.service
      - otel-collector
  clients.db:
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ClientsDb
    ports:  
      - "5432:5432"
  clients.cache:
    image: redis
    ports:
      - "6379:6379"      
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
  accounts.service:
    image: accounts.service
    build:
      context: .
      dockerfile: src/Accounts/Dockerfile
    restart: always
    environment:
        ConnectionStrings__AccountsDb: Host=accounts.db;Port=5432;Database=AccountsDb;Username=postgres;Password=postgres
        ConnectionStrings__RabbitMq: amqp://guest:guest@rabbitmq:5672/
        OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8081:8080"
    depends_on:
      - accounts.db
      - rabbitmq
      - otel-collector
  accounts.db:
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: AccountsDb
    ports:  
      - "5433:5432"
  notifications.service:
    image: notifications.service
    restart: always
    build:
      context: .
      dockerfile: src/Notifications/Dockerfile
    environment:
        ConnectionStrings__RabbitMq: amqp://guest:guest@rabbitmq:5672/
        OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8082:8080"
    depends_on:
      - rabbitmq
      - otel-collector
  risk.evaluator.service:
    image: risk.evaluator.service
    restart: always
    build:
      context: .
      dockerfile: src/RiskEvaluator/Dockerfile
    environment:
      Feature__PremiumMembershipFailure: false
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8083:8080"
    depends_on:
      - otel-collector
  reporting.service:
    image: reporting.service
    restart: always
    build:
      context: .
      dockerfile: src/Reporting/Dockerfile
    environment:
        ConnectionStrings__RabbitMq: amqp://guest:guest@rabbitmq:5672/
        OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8084:8080"
    depends_on:
      - rabbitmq
      - otel-collector
  jaeger:
    image: jaegertracing/all-in-one:1.58.0
    ports:
      - "16686:16686" # Jaeger Web UI
    # 4317 is no longer published: the collector receives OTLP and forwards to Jaeger.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.103.0
    volumes:
      - ./otel-collector/otel-collector-config.yml:/etc/otel/config.yaml
    command: --config /etc/otel/config.yaml
    environment:
      JAEGER_ENDPOINT: "jaeger:4317"
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "8889:8889"   # Prometheus exporter (scrape endpoint)
      - "8888:8888"   # Collector's own internal telemetry
      - "13133:13133" # health_check extension
      - "55679:55679" # zpages extension
    depends_on:
      - jaeger
      - prometheus
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
  grafana:
    image: grafana/grafana:11.1.0
    volumes:
      - ./grafana/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - jaeger
