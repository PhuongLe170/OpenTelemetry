global:
  evaluation_interval: 30s
  scrape_interval: 5s
scrape_configs:
  # Metrics pushed by the services via OTLP and re-exposed by the collector
  - job_name: otel
    static_configs:
      - targets:
          - 'otel-collector:8889'
  # The collector's own internal telemetry
  - job_name: otel-collector
    static_configs:
      - targets:
          - 'otel-collector:8888'
